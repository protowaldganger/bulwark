<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulwark</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <aside class="side">
    <div class="brand"><img src="../icons/icon-48.png" alt="" width="22" height="22"><b>Bulwark</b></div>
    <nav>
      <a href="#dashboard" data-v="dashboard">Dashboard</a>
      <a href="#privacy" data-v="privacy">Privacy</a>
      <a href="#lists" data-v="lists">Filter lists</a>
      <a href="#youtube" data-v="youtube">YouTube</a>
      <a href="#cookies" data-v="cookies">Cookies</a>
      <a href="#whitelist" data-v="whitelist">Whitelist</a>
      <a href="#filters" data-v="filters">My filters</a>
      <a href="#backup" data-v="backup">Backup</a>
      <a href="#about" data-v="about">About</a>
    </nav>
    <label class="side-foot">
      <span class="switch"><input type="checkbox" id="global" aria-label="Protection everywhere"><span></span></span>
      <span id="global-label">Protection on</span>
    </label>
  </aside>
  <main id="view" tabindex="-1"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="options.js" type="module"></script>
</body>
</html>

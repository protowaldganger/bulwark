<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulwark</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="../icons/icon-32.png" alt="" width="18" height="18"><b>Bulwark</b></div>
    <span class="pill" id="privacy" title="Strict privacy: Bulwark makes no network requests on its own">Strict privacy</span>
    <label class="switch" title="Protection everywhere"><input type="checkbox" id="global" aria-label="Protection everywhere"><span></span></label>
  </header>

  <main id="main" hidden>
    <section class="site">
      <div>
        <div class="host" id="host"></div>
        <div class="state" id="state"></div>
      </div>
      <label class="switch big" title="Blocking on this site"><input type="checkbox" id="site" aria-label="Blocking on this site"><span></span></label>
    </section>

    <section class="panel" id="tiles">
      <div class="stat"><b id="n-blocked">0</b><span>Requests blocked</span></div>
      <div class="stat"><b id="n-hidden">0</b><span>Elements hidden</span></div>
      <div class="stat"><b id="n-cookies">0</b><span>Cookies blocked</span></div>
      <div class="stat" id="tile-yt" hidden><b id="n-yt">0</b><span>YouTube ads removed</span></div>
    </section>

    <section class="ytfix" id="ytfix" hidden>
      <div class="tools one">
        <button type="button" id="yt-fix" title="Load this video again with nothing changed or removed. Lasts until you reload the page. Ads that play are skipped.">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 6.5A6.5 6.5 0 1 0 16.5 10"/><path d="M16 3v3.8h-3.8"/></svg><span>Video won't play? Fix it</span></button>
      </div>
    </section>

    <section class="cookies">
      <div class="label">Cookies on this site</div>
      <div class="seg" id="cookies" role="group" aria-label="Cookie policy">
        <button type="button" data-p="block" aria-pressed="false">Block all</button>
        <button type="button" data-p="necessary" aria-pressed="false">Necessary</button>
        <button type="button" data-p="allow" aria-pressed="false">Allow all</button>
      </div>
      <p class="hint" id="cookie-hint"></p>
    </section>

    <section class="switches">
      <div class="label">On this site</div>
      <div class="tools" id="switches" role="group" aria-label="Switches for this site">
        <button type="button" data-k="noPopups" aria-pressed="false" title="Close every pop-up, pop-under and new tab this site opens, even from links you click">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="6" width="11" height="10" rx="2"/><path d="M7 6V4.5A1.5 1.5 0 0 1 8.5 3H15.5A1.5 1.5 0 0 1 17 4.5V11.5A1.5 1.5 0 0 1 15.5 13H14"/></svg><span>No pop-ups</span></button>
        <button type="button" data-k="noMedia" aria-pressed="false" title="Block video and audio files on this site">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="11" rx="2.5"/><path d="M8.5 7.8v4.4l3.6-2.2z"/></svg><span>No media</span></button>
        <button type="button" data-k="noFonts" aria-pressed="false" title="Block downloaded web fonts on this site (icons drawn with fonts may disappear)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16L9 4h2l5 12"/><path d="M6.3 11.5h7.4"/></svg><span>No fonts</span></button>
        <button type="button" data-k="noScripts" aria-pressed="false" title="Turn off JavaScript on this site. Many sites stop working without it.">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5.5L3 10l4.5 4.5"/><path d="M12.5 5.5L17 10l-4.5 4.5"/></svg><span>No JavaScript</span></button>
        <button type="button" data-k="noCosmetic" aria-pressed="false" title="Stop hiding page elements on this site (network blocking stays on)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 10s2.8-5 7.5-5 7.5 5 7.5 5-2.8 5-7.5 5-7.5-5-7.5-5z"/><circle cx="10" cy="10" r="2.2"/></svg><span>No hiding</span></button>
        <button type="button" data-k="fullCosmetic" aria-pressed="false" title="Lighter mode is on: use every hiding rule on this site" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l6.5 2.5v4.6c0 4-2.8 6.9-6.5 7.9-3.7-1-6.5-3.9-6.5-7.9V5z"/><path d="M7.2 10l2 2 3.8-4"/></svg><span>Full hiding</span></button>
      </div>
    </section>
  </main>

  <main id="inactive" class="inactive" hidden>
    <p><b>Nothing to block here.</b></p>
    <p class="muted">Bulwark works on regular web pages. Browser pages and the extension store are off limits to every extension.</p>
  </main>

  <a class="lists" id="lists" href="#" title="Manage filter lists"><span id="lists-text">Filter lists</span><span aria-hidden="true">›</span></a>

  <footer class="bottom">
    <button class="btn" id="pick" type="button" title="Pick an element and hide it on this site for good">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l4.2 10 1.5-4.3L13 7.2z"/></svg>Block element
    </button>
    <button class="btn" id="zap" type="button" title="Click elements to remove them from this page now (nothing is saved)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1.5L3.5 9H8l-1 5.5L12.5 7H8z"/></svg>Remove element
    </button>
    <button class="btn" id="log" type="button" title="What Bulwark blocked and allowed on this tab">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6"/></svg>Request log
    </button>
    <button class="btn ink" id="options" type="button">Dashboard</button>
  </footer>
  <script src="popup.js" type="module"></script>
</body>
</html>

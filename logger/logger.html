<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request log</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="logger.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><img src="../icons/icon-32.png" alt="" width="18" height="18"><b>Request log</b></div>
    <span class="tabname" id="tabname"></span>
    <span class="grow"></span>
    <button class="btn" id="pause" type="button" aria-pressed="false">Pause</button>
    <button class="btn" id="clear" type="button">Clear</button>
  </header>
  <div class="filters">
    <div class="seg" id="kind" role="group" aria-label="Show">
      <button type="button" data-k="all" aria-pressed="true">All</button>
      <button type="button" data-k="blocked" aria-pressed="false">Blocked</button>
      <button type="button" data-k="allowed" aria-pressed="false">Allowed</button>
      <button type="button" data-k="changed" aria-pressed="false">Changed</button>
    </div>
    <input type="search" id="q" placeholder="Filter by address, type or list" aria-label="Filter">
    <span class="count" id="count"></span>
  </div>
  <p class="note" id="note" hidden></p>
  <main>
    <table>
      <thead><tr><th class="c-time">Time</th><th class="c-act">Result</th><th class="c-type">Type</th><th>Address</th><th class="c-list">Rule</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="empty">Nothing yet. Load or reload the page in that tab.</p>
  </main>
  <script src="logger.js" type="module"></script>
</body>
</html>

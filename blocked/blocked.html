<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Page blocked</title>
<link rel="stylesheet" href="../ui/theme.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--wash); }
  main { width: 100%; max-width: 500px; background: var(--ground); border-radius: var(--radius); padding: 30px 28px 24px; }
  .mark { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--pill); color: var(--warn); margin-bottom: 18px; }
  h1 { font-size: 21px; font-weight: 500; line-height: 1.25; margin: 0 0 14px; letter-spacing: -.01em; }
  .host { font-size: 17px; font-weight: 500; word-break: break-all; margin: 0 0 2px; }
  .url { color: var(--ink-3); font-size: 12.5px; word-break: break-all; margin: 0 0 16px; max-height: 3.2em; overflow: hidden; }
  p.why { color: var(--ink-2); margin: 0 0 22px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { font-weight: 500; border-radius: 999px; padding: 8px 18px; cursor: pointer; border: 0; background: var(--pill); }
  button.primary { background: var(--ink); color: var(--on-ink); }
  details { margin-top: 22px; border-top: 1px solid var(--hair); padding-top: 14px; }
  summary { cursor: pointer; color: var(--ink-2); font-size: 13.5px; }
  details .row { margin-top: 12px; }
  label { color: var(--ink-2); font-size: 13.5px; display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4"/><path d="M12 17.5v.01"/></svg></div>
  <h1>Bulwark stopped this page</h1>
  <p class="host" id="host">This page</p>
  <p class="url" id="url" hidden></p>
  <p class="why">It is on one of your filter lists. Lists name pages like this for spreading malware, scams or fake downloads, or for tracking and ads. Nothing from it has loaded.</p>
  <div class="row"><button class="primary" id="back">Go back</button></div>
  <details id="more" hidden>
    <summary>I know this site and want to open it</summary>
    <label><input type="checkbox" id="always"> Don't warn me about this site again</label>
    <div class="row"><button id="go">Open anyway</button></div>
  </details>
</main>
<script src="blocked.js"></script>
</body>
</html>
